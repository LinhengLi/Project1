<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>巨型星座与网关 · 独立总览</title><script src="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Cesium.js"></script><link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Widgets/widgets.css">
<style>html,body,#globe{height:100%;width:100%;margin:0;background:#071120;color:#e4efff;font:14px system-ui}aside{position:absolute;top:16px;left:16px;width:320px;max-height:calc(100vh - 70px);overflow:auto;padding:20px;background:#0a192eef;border:1px solid #34516c;border-radius:12px}h1{font-size:22px}p,small{color:#9fb4ca;line-height:1.7}a{color:#75dfca}button,select,input[type=search]{padding:8px;border:1px solid #42627f;border-radius:5px;background:#19344d;color:#e8f4ff}label{display:block;padding:6px 0}select,input[type=search],input[type=range]{width:100%;box-sizing:border-box;margin:8px 0}pre{white-space:pre-wrap;line-height:1.7;font-size:12px}.counts{color:#6fdbc6;line-height:1.9}#error{color:#ff8e99}</style>
<div id="globe"></div><aside><a href="../">← 可视化档案首页</a><h1>巨型星座 · 卫星与网关</h1><p>Starlink + OneWeb + GSO<br>既有本地轨道与站点集合，独立展示缓存。</p><div class="counts" id="counts">正在加载…</div><label><input type="checkbox" id="starlink" checked> Starlink 卫星</label><label><input type="checkbox" id="oneweb" checked> OneWeb 卫星</label><label><input type="checkbox" id="gso" checked> GSO 卫星</label><label><input type="checkbox" id="stations" checked> 显示网关与GSO参考接收点</label><label><input type="checkbox" id="pointing" checked> GSO固定参考指向</label><p id="clock"></p><input id="time" type="range" min="0" max="120" value="0" aria-label="轨道展示时间"><button id="play">▶ 播放</button> <button id="home">全球视角</button><select id="system" aria-label="筛选网关系统"><option value="all">全部系统站点</option><option value="starlink">Starlink</option><option value="oneweb">OneWeb</option><option value="gso">GSO参考点</option></select><input id="search" type="search" placeholder="搜索站名或ID" aria-label="搜索网关"><select id="station" aria-label="选择网关"></select><pre id="detail">点击卫星或选择网关查看信息。</pre><p id="error"></p><small>121个轨道展示快照，60秒采样，含两小时终点；不是新增干扰实验。显示全部目录卫星，未按研究高度筛选，不代表它们同时建立馈电链路。站址含社区近似与仿真位置，当前运营状态未确认。青色Starlink、紫色OneWeb、金色GSO。</small></aside>
<script>
const $=id=>document.getElementById(id),colors={starlink:'#44d7e8',oneweb:'#b38cff',gso:'#ffc46b'};let viewer,cloud,satellites,stations,frame,index=0,token=0,timer;
function home(){viewer.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(10,20,23000000),duration:1})}
function draw(){cloud.removeAll();for(let i=0;i<satellites.length;i++){let s=satellites[i];if(!$(s.system).checked)continue;cloud.add({position:new Cesium.Cartesian3(...frame.positions_m[i]),pixelSize:s.system==='gso'?6:2.5,color:Cesium.Color.fromCssColorString(colors[s.system]),id:{satellite:i}})}viewer.entities.removeAll();if($('stations').checked)for(const g of stations){if($('system').value!=='all'&&g.constellation_id!==$('system').value)continue;if(!(g.id+' '+g.name).toLowerCase().includes($('search').value.toLowerCase()))continue;const m=g.research_metadata;viewer.entities.add({id:'station:'+g.id,position:Cesium.Cartesian3.fromDegrees(g.longitude,g.latitude,g.altitude_m+(g.constellation_id==='gso'?3000:0)),point:{pixelSize:g.constellation_id==='gso'?13:7,color:Cesium.Color.fromCssColorString(colors[g.constellation_id]),outlineWidth:2,outlineColor:Cesium.Color.fromCssColorString(m.position_verified?'#ffffff':m.simulation_location?'#579dff':'#ff983e')}});if(g.constellation_id==='gso'&&$('pointing').checked){const i=satellites.findIndex(s=>s.id===m.pointing_satellite_id);if(i>=0)viewer.entities.add({polyline:{positions:[Cesium.Cartesian3.fromDegrees(g.longitude,g.latitude,g.altitude_m),new Cesium.Cartesian3(...frame.positions_m[i])],width:1.5,material:new Cesium.PolylineDashMaterialProperty({color:Cesium.Color.fromCssColorString('#88dfa7')})}})}}$('clock').textContent=frame.timestamp+' · '+(index+1)+'/121';$('time').value=index}
async function loadframe(i){const own=++token;$('error').textContent='读取轨道快照…';try{const r=await fetch(`frame_${String(i).padStart(3,'0')}.json.gz`);if(!r.ok)throw Error('轨道快照读取失败');const result=await new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).json();if(own!==token)return;frame=result;index=i;draw();$('error').textContent=''}catch(e){$('error').textContent=e.message}}
function filter(){const selected=$('station').value;$('station').replaceChildren(new Option('选择网关站查看详情',''));for(const g of stations)if(($('system').value==='all'||g.constellation_id===$('system').value)&&(g.id+' '+g.name).toLowerCase().includes($('search').value.toLowerCase()))$('station').add(new Option(g.id+' · '+g.name,g.id));if([...$('station').options].some(o=>o.value===selected))$('station').value=selected;if(frame)draw()}
function details(id){const g=stations.find(g=>g.id===id);if(!g)return;const m=g.research_metadata;$('detail').textContent=`${g.name}\n${g.id} · ${g.constellation_id}\n纬度 ${g.latitude.toFixed(6)}° / 经度 ${g.longitude.toFixed(6)}°\n坐标类别：${m.position_accuracy||'GSO仿真参考点'}\n当前运营：${m.active_now_confirmed?'资料标记已确认':'未确认'}`;viewer.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(g.longitude,g.latitude,3500000),duration:1})}
for(const id of ['starlink','oneweb','gso','stations','pointing'])$(id).onchange=()=>{if(frame)draw()};for(const id of ['search','system'])$(id).oninput=filter;$('station').onchange=()=>details($('station').value);$('time').oninput=()=>loadframe(+$('time').value);$('home').onclick=home;$('play').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('play').textContent='▶ 播放';return}$('play').textContent='⏸ 暂停';timer=setInterval(()=>{if(index>=120){clearInterval(timer);timer=null;$('play').textContent='▶ 播放';return}loadframe(index+1)},1000)};
(async()=>{try{if(!window.Cesium)throw Error('Cesium在线资源未加载，请联网刷新。');[satellites,stations]=await Promise.all(['satellites.json','stations.json'].map(p=>fetch(p).then(r=>r.json())));viewer=new Cesium.Viewer('globe',{baseLayer:false,baseLayerPicker:false,geocoder:false,animation:false,timeline:false,navigationHelpButton:false});viewer.scene.globe.baseColor=Cesium.Color.fromCssColorString('#153650');viewer.imageryLayers.addImageryProvider(new Cesium.UrlTemplateImageryProvider({url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',maximumLevel:5,credit:'OpenStreetMap'}));cloud=viewer.scene.primitives.add(new Cesium.PointPrimitiveCollection());home();$('counts').textContent=`卫星：Starlink ${satellites.filter(s=>s.system==='starlink').length} / OneWeb ${satellites.filter(s=>s.system==='oneweb').length} / GSO ${satellites.filter(s=>s.system==='gso').length}\n站点：Starlink 218 / OneWeb 13 / GSO参考点 12`;$('counts').style.whiteSpace='pre-line';filter();const h=new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);h.setInputAction(e=>{const p=viewer.scene.pick(e.position);if(p?.id?.satellite!==undefined){const s=satellites[p.id.satellite];$('detail').textContent=s.name+'\n'+s.id+'\n'+s.system}else if(p?.id?.id?.startsWith('station:'))details(p.id.id.slice(8))},Cesium.ScreenSpaceEventType.LEFT_CLICK);await loadframe(0)}catch(e){$('error').textContent=e.message}})();
</script></html>
