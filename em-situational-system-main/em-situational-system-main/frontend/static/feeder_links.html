<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>馈电活动关联 · v1.1</title>
<script src="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Cesium.js"></script>
<link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Widgets/widgets.css">
<style>html,body,#globe{height:100%;width:100%;margin:0;background:#071120;color:#e6efff;font:14px Microsoft YaHei,sans-serif}aside{position:absolute;top:20px;left:20px;background:#0b192ef2;padding:20px;width:330px;max-height:85vh;overflow:auto;border-radius:12px;border:1px solid #31536c}h1{font-size:21px}p,small{color:#9fb2cb;line-height:1.8}input,select{width:100%;margin:10px 0}#stats,#detail{white-space:pre-line;line-height:1.8}a{color:#6fdaee}button{padding:8px;background:#163656;border:1px solid #31597c;color:white;border-radius:6px}table{font-size:11px;width:100%;margin:10px 0}td,th{text-align:left;border-bottom:1px solid #31536c;padding:5px}</style>
<div id="globe"></div><aside><small>FEEDER RESEARCH / GEOMETRY</small><h1>活动馈电关联 · v1.1</h1><p>冻结v1输入的派生几何实验<br>40°仰角 · 每站最多8链路 · 同系统选星</p><div id="stats">加载中…</div><input id="time" aria-label="时间快照" type="range" min="0" value="0"><button id="next">下一时隙 +10秒</button><select id="link" aria-label="查看活动馈电链路"></select><div id="detail">请选择链路查看仰角和斜距。</div><table><thead><tr><th>网关</th><th>候选/活动/容量</th></tr></thead><tbody id="stations"></tbody></table><p>青线：Starlink；紫线：OneWeb；金线：GSO固定参考关联。仅显示关联卫星。<br>未分配频率，未计算干扰、LF、EPFD。GSO几何可见不代表波束覆盖。</p><a href="constellations.html?scene=baseline">冻结配置</a> · <a href="feeder_associations_v1_1.json">实验数据</a></aside>
<script>
let experiment,viewer,index=0;const colors={starlink:'#44d7e8',oneweb:'#b38cff',gso:'#ffc46b'};
function position(p){return Cesium.Cartesian3.fromDegrees(p.longitude,p.latitude,p.altitude_m||0)}
function draw(){const f=experiment.frames[index];viewer.entities.removeAll();const sites=new Map(experiment.ground_stations.map(g=>[g.id,g]));const satellites=new Map(f.positions.map(p=>[p.entity_id,p]));
for(const g of sites.values())viewer.entities.add({position:position(g),point:{pixelSize:9,color:Cesium.Color.fromCssColorString(colors[g.constellation_id]),outlineWidth:1,outlineColor:Cesium.Color.WHITE}});
for(const p of satellites.values())viewer.entities.add({position:position(p),point:{pixelSize:5,color:Cesium.Color.fromCssColorString(colors[p.constellation_id])}});
const links=[...f.links,...f.protected_links];for(const l of links){const g=sites.get(l.gateway_id),p=satellites.get(l.satellite_id);viewer.entities.add({polyline:{positions:[position(g),position(p)],width:g.constellation_id==='gso'?1:2,material:Cesium.Color.fromCssColorString(colors[g.constellation_id])}})}
document.getElementById('stats').textContent=`${f.timestamp}\nStarlink ${f.links.filter(l=>l.constellation_id==='starlink').length} / OneWeb ${f.links.filter(l=>l.constellation_id==='oneweb').length} 条活动关联\nGSO ${f.protected_links.length} 条固定参考关联\n几何筛选排除 ${f.orbit_audit.excluded.length} 颗；历元警告 ${f.orbit_audit.epoch_warnings.length} 颗\n快照 ${index+1} / ${experiment.frames.length}`;
const list=document.getElementById('link');list.replaceChildren(new Option('选择活动馈电链路',''));for(const l of links)list.add(new Option(l.gateway_id+' ← '+satellites.get(l.satellite_id).name,l.link_id));document.getElementById('detail').textContent='关联按轮询最高仰角确定，未分配频率。';
const tbody=document.getElementById('stations');tbody.replaceChildren();for(const s of f.station_summary){const tr=document.createElement('tr');for(const text of [s.gateway_id,`${s.visible_candidates} / ${s.active_count} / ${s.capacity}`]){const td=document.createElement('td');td.textContent=text;tr.append(td)}tbody.append(tr)}
}
document.getElementById('time').oninput=e=>{index=Number(e.target.value);draw()};document.getElementById('next').onclick=()=>{index=Math.min(index+1,experiment.frames.length-1);document.getElementById('time').value=index;draw()};document.getElementById('link').onchange=e=>{const f=experiment.frames[index],l=[...f.links,...f.protected_links].find(l=>l.link_id===e.target.value);if(!l)return;document.getElementById('detail').textContent=`${l.link_id}\n仰角 ${l.elevation_deg.toFixed(3)}°\n方位角 ${l.azimuth_deg.toFixed(3)}°\n斜距 ${l.range_km.toFixed(3)} km`;const g=experiment.ground_stations.find(g=>g.id===l.gateway_id);viewer.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(g.longitude,g.latitude,4000000),duration:1})};
(async()=>{try{const r=await fetch('feeder_associations_v1_1.json');if(!r.ok)throw Error('关联数据尚未生成');experiment=await r.json();viewer=new Cesium.Viewer('globe',{baseLayer:false,baseLayerPicker:false,geocoder:false,animation:false,timeline:false});viewer.scene.globe.baseColor=Cesium.Color.fromCssColorString('#153650');viewer.imageryLayers.addImageryProvider(new Cesium.UrlTemplateImageryProvider({url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',maximumLevel:5,credit:'OpenStreetMap'}));viewer.camera.setView({destination:Cesium.Cartesian3.fromDegrees(-100,25,30000000)});document.getElementById('time').max=experiment.frames.length-1;draw()}catch(e){document.getElementById('stats').textContent=e.message}})();
</script></html>
