<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>异构星座轨道总览</title>
<script src="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Cesium.js"></script>
<link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Widgets/widgets.css">
<style>html,body,#globe{width:100%;height:100%;margin:0;background:#071120;color:#e6efff;font-family:Segoe UI,Microsoft YaHei,sans-serif}aside{position:absolute;top:24px;left:24px;width:300px;padding:24px;background:#0b192eee;border:1px solid #29415c;border-radius:16px;box-shadow:0 16px 60px #0008}h1{font-size:23px;margin:8px 0 18px}.eyebrow{color:#68d7ee;font-size:12px;letter-spacing:2px}.row{padding:16px 0;border-top:1px solid #29415c;display:flex;justify-content:space-between}small,p{color:#9fb2cb;line-height:1.7}button,a{background:#163656;border:1px solid #31597c;color:#e6efff;border-radius:8px;padding:9px;cursor:pointer;text-decoration:none}#info{white-space:pre-line;font-size:13px;margin-top:20px}footer{position:absolute;bottom:35px;left:380px;color:#9fb2cb;font-size:12px}#error{color:#ffb2a8}</style>
<div id="globe"></div><aside><div class="eyebrow">FEEDER LINK RESEARCH / 01</div><h1>异构星座轨道总览</h1><p>本地轨道快照 · SGP4 传播</p><div id="groups"></div><p id="time">正在加载轨道…</p><button id="step">推进 60 秒</button> <button id="reset">重置历元</button><p><a href="/static/index.html">原系统态势面板 ↗</a></p><div id="info">点击卫星查看名称与高度。<br>滚轮缩放，拖动旋转地球。</div><p id="error"></p><small>Starlink 按本地混合目录导入，未逐星认定 Gen1 / Gen2。GSO 为首批 12 颗频段重叠候选，其余 556 颗待核实；尚未启用 GSO 干扰计算。本页展示轨道，不代表已建立馈电链路。</small></aside><footer>Starlink 青色 · OneWeb 紫色 · GSO 金色 ｜ 地球与轨道按实际比例显示</footer>
<script>
const baselineMode = new URLSearchParams(location.search).get('scene') === 'baseline';
const scenePath = baselineMode ? 'feeder_baseline_v1.json' : 'three_constellations.json';
const stepSeconds = baselineMode ? 10 : 60;
const colors={starlink:'#44d7e8',oneweb:'#b38cff',gso:'#ffc46b'},labels={starlink:'Starlink · Gen1 + Gen2 数据集',oneweb:'OneWeb',gso:'GSO · 17.8–18.6 GHz 候选'};
let viewer,cloud,data=[],enabled={starlink:true,oneweb:true,gso:true};
async function api(path,body){const r=await fetch('/api/v1'+path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});if(!r.ok)throw Error(await r.text());return r.json()}
function draw(){cloud.removeAll();for(const p of data){if(!enabled[p.constellation_id])continue;cloud.add({position:Cesium.Cartesian3.fromDegrees(p.longitude,p.latitude,p.altitude_m),pixelSize:p.constellation_id==='gso'?5:3,color:Cesium.Color.fromCssColorString(colors[p.constellation_id]),id:p});}}
async function refresh(){const [positions,snap]=await Promise.all([api('/constellation/positions'),api('/situational/current')]);data=positions;document.getElementById('time').textContent='仿真时间（UTC） '+snap.timestamp;document.getElementById('groups').replaceChildren();for(const id of Object.keys(colors)){const row=document.createElement('label');row.className='row';row.style.color=colors[id];const cb=document.createElement('input');cb.type='checkbox';cb.checked=enabled[id];cb.onchange=()=>{enabled[id]=cb.checked;draw()};row.append(cb,document.createTextNode(labels[id]+'  '+data.filter(p=>p.constellation_id===id).length));document.getElementById('groups').append(row)}draw()}
async function run(fn){try{document.getElementById('error').textContent='';await fn()}catch(e){document.getElementById('error').textContent=e.message}}
run(async()=>{if(!window.Cesium)throw Error('三维资源加载失败，请检查网络后刷新');viewer=new Cesium.Viewer('globe',{baseLayer:false,baseLayerPicker:false,geocoder:false,animation:false,timeline:false,homeButton:false,sceneModePicker:false,navigationHelpButton:false});viewer.scene.globe.baseColor=Cesium.Color.fromCssColorString('#153650');viewer.imageryLayers.addImageryProvider(new Cesium.UrlTemplateImageryProvider({url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',maximumLevel:5,credit:'OpenStreetMap'}));viewer.scene.backgroundColor=Cesium.Color.fromCssColorString('#071120');viewer.camera.setView({destination:Cesium.Cartesian3.fromDegrees(105,20,100000000)});cloud=viewer.scene.primitives.add(new Cesium.PointPrimitiveCollection());const handler=new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);handler.setInputAction(e=>{const picked=viewer.scene.pick(e.position);if(picked?.id?.entity_id){const p=picked.id;document.getElementById('info').textContent=p.name+'\n'+p.constellation_id+'\n高度 '+(p.altitude_m/1000).toFixed(1)+' km\n经度 '+p.longitude.toFixed(3)+'° / 纬度 '+p.latitude.toFixed(3)+'°'}},Cesium.ScreenSpaceEventType.LEFT_CLICK);await api('/scenario/load',{path:scenePath});await refresh()});
document.getElementById('step').onclick=()=>run(async()=>{await api('/simulation/step?delta_sec='+stepSeconds,{});await refresh()});document.getElementById('reset').onclick=()=>run(async()=>{await api('/scenario/load',{path:scenePath});await refresh()});
</script><script src="/static/gateways.js"></script><script src="/static/baseline.js"></script></html>
