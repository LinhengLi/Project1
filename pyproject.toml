[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qv-feeder-sim"
version = "0.1.0"
description = "Orbit-driven Q/V feeder-link research foundations"
requires-python = ">=3.11"
dependencies = ["sgp4>=2.23,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
analysis = ["skyfield>=1.55,<2", "numpy>=2,<3"]
optimization = ["numpy>=2,<3", "scipy>=1.14,<2", "matplotlib>=3.9,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
