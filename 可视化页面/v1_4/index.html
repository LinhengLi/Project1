<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>历史版本可视化</title>
<script src="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Cesium.js"></script><link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Widgets/widgets.css">
<style>body{margin:0;background:#091321;color:#dfebf7;font:14px system-ui}header{padding:18px 24px}a{color:#6be2cc}h1{font-size:23px;margin:10px 0}p{color:#9fb4ce;line-height:1.7}main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(330px,1fr);gap:14px;padding:0 20px 20px}section{background:#122338;border:1px solid #2d4661;padding:15px;border-radius:12px;min-width:0}#globe{height:570px}select,button,input{background:#1a3650;color:white;border:1px solid #426281;border-radius:5px;padding:7px}input[type=range]{width:100%}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}#stats{font-size:18px;color:#71e0c6;padding:15px 0}canvas{width:100%;height:180px}table{width:100%;font-size:12px;border-collapse:collapse}td,th{border-bottom:1px solid #30435b;padding:6px;text-align:left}.scroll{max-height:270px;overflow:auto}pre{white-space:pre-wrap;color:#a7bfd9;line-height:1.6}#detail{min-height:55px}@media(max-width:800px){main{grid-template-columns:1fr}}</style>
<header><a href="../">← 可视化档案首页</a><h1 id="title">正在读取历史数据…</h1><p id="note"></p><div class="row"><button id="play">▶ 播放</button><label>快照 <input id="frame" type="number" value="0" min="0" style="width:75px"></label><select id="mode" aria-label="历史分频模式"></select><b id="clock"></b></div><input id="time" type="range" min="0" value="0" aria-label="快照时间轴"></header>
<main><section><div id="globe"></div><p>线条为服务关联与固定GSO参考指向，不是干扰传播线。青色Starlink、紫色OneWeb、金色GSO；红色服务链路为当前结果中失效的NGSO链路。</p><select id="link" aria-label="查看链路"></select><pre id="detail"></pre></section><section><div id="stats"></div><h3>LF时序（当前模式）</h3><canvas id="chart"></canvas><div class="row"><label>口径 <select id="diam"><option>1</option><option>2</option><option>5</option></select>m</label><label>带宽 <select id="bw"><option value="40000">40kHz</option><option value="1000000">1MHz</option></select></label><select id="op" aria-label="EPFD系统贡献"><option value="combined">两系统合计</option><option value="starlink">Starlink</option><option value="oneweb">OneWeb</option></select></div><h3 id="gtitle">GSO结果</h3><div class="scroll"><table><thead><tr><th>保护关联</th><th id="unit">数值</th><th>峰值窗口/频道</th></tr></thead><tbody id="gso"></tbody></table></div><p id="boundary"></p><a href="原始结果/">查看本版本原始参数与结果文件 →</a><p>页面只读取本目录数据，不调用共享场景API。不能把历史诊断频点安排解释为优化分配，也不能把采样结果解释为连续时间保护证明。</p></section></main>
<script>
const $=id=>document.getElementById(id),colors={starlink:'#44d7e8',oneweb:'#b38cff',gso:'#ffc46b'};let data,viewer,index=0,timer;
const names={geometry:'仅几何关联',antenna_index:'序号分频诊断',all_cochannel:'全同频压力对照',antenna_index_scaled:'序号分频 · TX频率缩放',all_cochannel_scaled:'全同频 · TX频率缩放'};
function metric(i=index){return data.ngso[$('mode').value]?.[i]}
function point(p){return Cesium.Cartesian3.fromDegrees(p.longitude,p.latitude,p.altitude_m||0)}
function plot(){const c=$('chart'),r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;let x=c.getContext('2d');x.scale(d,d);x.font='12px system-ui';x.fillStyle='#a9bcd3';const values=data.frames.map((f,i)=>metric(i)?.lf);if(values.every(v=>v==null)){x.fillText('该阶段未输出此项LF统计',15,55);return}const max=Math.max(.01,...values.filter(v=>v!=null))*1.15,w=r.width-65,h=r.height-40;x.strokeStyle='#32485f';for(let k=0;k<4;k++){let y=10+k*h/3;x.beginPath();x.moveTo(45,y);x.lineTo(r.width,y);x.stroke();x.fillText((100*max*(1-k/3)).toFixed(1)+'%',0,y+4)}x.strokeStyle='#69dfc3';x.beginPath();values.forEach((v,i)=>{if(v!=null){let px=45+i/Math.max(1,values.length-1)*w,py=10+(1-v/max)*h;i?x.lineTo(px,py):x.moveTo(px,py)}});x.stroke();x.strokeStyle='#ffffff88';x.beginPath();let xx=45+index/Math.max(1,values.length-1)*w;x.moveTo(xx,10);x.lineTo(xx,h+10);x.stroke();x.fillText('首帧',45,r.height-5);x.fillText('末帧',r.width-40,r.height-5)}
function draw(){const f=data.frames[index],m=metric();$('clock').textContent=f.timestamp;$('frame').value=$('time').value=index;$('stats').textContent=`活动 ${f.links.length}条 · `+(m?`失效 ${m.failed}条 · LF ${(m.lf*100).toFixed(3)}%`:'此阶段未输出NGSO失效统计');
if(viewer){viewer.entities.removeAll();const sites=new Map(data.ground_stations.map(g=>[g.id,g])),sats=new Map(f.positions.map(p=>[p.entity_id,p]));for(const g of sites.values())viewer.entities.add({position:point(g),point:{pixelSize:8,color:Cesium.Color.fromCssColorString(colors[g.constellation_id])}});for(const p of sats.values())viewer.entities.add({position:point(p),point:{pixelSize:4,color:Cesium.Color.fromCssColorString(colors[p.constellation_id])}});for(const [i,l] of [...f.links,...f.protected_links].entries()){const g=sites.get(l.gateway_id),p=sats.get(l.satellite_id);if(!g||!p)continue;const bad=i<f.links.length&&m?.in_db?.[i]>-12.2;viewer.entities.add({polyline:{positions:[point(g),point(p)],width:bad?3:1.4,material:Cesium.Color.fromCssColorString(bad?'#ff7689':colors[g.constellation_id])}})}}
$('link').replaceChildren(new Option('选择链路查看仰角、斜距',''));for(const l of [...f.links,...f.protected_links])$('link').add(new Option(l.gateway_id+' ← '+l.satellite_id,l.link_id));$('detail').textContent='';plot();table()}
function table(){const ep=data.gso_kind==='epfd',power=data.gso_kind==='power';for(const id of ['diam','bw','op'])$(id).disabled=!ep;$('gtitle').textContent=ep?'已评价窗口中的峰值EPFD':power?'GSO频道功率诊断':'此阶段未计算GSO干扰';$('unit').textContent=ep?'dB(W/m²)':power?'接收功率 W':'—';$('boundary').textContent=ep?'独立1/2/5m参考口径；只展示窗口取样峰值。V1.4.1原实验未执行限值曲线比较，本页保留该边界，不输出法规合规结论。':power?'这是3.5m设备的历史频道功率分箱，不能套用40kHz/1MHz EPFD限值。':'GSO线条只表示固定参考关联，不能解释为已完成EPFD计算。';const all=data.gso[$('mode').value+'/'+index]||[],peaks=new Map();for(const r of all){if(ep&&(r.diam!==+$('diam').value||r.bw!==+$('bw').value||r.op!==$('op').value))continue;if(!peaks.has(r.receiver)||r.value>peaks.get(r.receiver).value)peaks.set(r.receiver,r)}$('gso').replaceChildren();for(const r of peaks.values()){let tr=document.createElement('tr');for(const s of [r.receiver,r.value>0?(ep?(10*Math.log10(r.value)).toFixed(4):r.value.toExponential(5)):'零贡献',r.value>0?r.window:'—']){let td=document.createElement('td');td.textContent=s;tr.append(td)}$('gso').append(tr)}}
$('mode').onchange=draw;for(const id of ['diam','bw','op'])$(id).onchange=table;for(const id of ['time','frame'])$(id).oninput=()=>{index=Math.max(0,Math.min(data.frames.length-1,+$(id).value));draw()};$('play').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('play').textContent='▶ 播放';return}$('play').textContent='⏸ 暂停';timer=setInterval(()=>{if(index===data.frames.length-1){clearInterval(timer);timer=null;$('play').textContent='▶ 播放';return}index++;draw()},1000)};$('link').onchange=()=>{const f=data.frames[index],l=[...f.links,...f.protected_links].find(l=>l.link_id===$('link').value);if(!l)return;$('detail').textContent=`${l.link_id}\n仰角 ${l.elevation_deg.toFixed(3)}° · 斜距 ${l.range_km.toFixed(3)} km`;const g=data.ground_stations.find(g=>g.id===l.gateway_id);viewer?.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(g.longitude,g.latitude,4000000),duration:1})};
fetch('data.json').then(r=>{if(!r.ok)throw Error('数据读取失败');return r.json()}).then(d=>{data=d;document.title=d.version+' · '+d.title;$('title').textContent=document.title;$('note').textContent=d.notes;for(const mode of d.modes)$('mode').add(new Option(names[mode],mode));$('time').max=$('frame').max=d.frames.length-1;if(window.Cesium){viewer=new Cesium.Viewer('globe',{baseLayer:false,baseLayerPicker:false,geocoder:false,animation:false,timeline:false,navigationHelpButton:false});viewer.scene.globe.baseColor=Cesium.Color.fromCssColorString('#153650');viewer.imageryLayers.addImageryProvider(new Cesium.UrlTemplateImageryProvider({url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',maximumLevel:5,credit:'OpenStreetMap'}));viewer.camera.setView({destination:Cesium.Cartesian3.fromDegrees(-90,25,23000000)})}else $('globe').textContent='Cesium在线资源未加载，请联网刷新；下方统计仍可查看。';draw()}).catch(e=>$('title').textContent=e.message);window.onresize=()=>{if(data)plot()};
</script></html>
